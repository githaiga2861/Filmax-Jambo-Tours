<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>My Profile | Filmax Jambo Tours</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080808; --panel:#0f0f0f; --line:rgba(212,175,55,0.18);
  --gold:#d4af37; --gold-soft:rgba(212,175,55,0.6);
  --text:#f0ece4; --muted:#8a8074; --danger:#e05555;
}
body.light-mode{
  --bg:#f4f1ea; --panel:#ffffff; --line:rgba(139,90,0,0.16);
  --gold:#8a5a00; --gold-soft:rgba(138,90,0,0.7);
  --text:#14100a; --muted:#5c5347;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-weight:400;
  -webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gold-soft);}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 28px;background:var(--bg);border-bottom:1px solid var(--line);}
.topbar-label{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);font-weight:600;}
.btn{font-family:'Jost',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  padding:11px 20px;background:none;border:1px solid var(--line);color:var(--text);cursor:pointer;
  transition:border-color .3s,color .3s,background .3s;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#0a0a0a;}
.btn-gold:hover{opacity:.88;color:#0a0a0a;}
.btn-danger{color:var(--danger);border-color:rgba(224,85,85,.35);}
.btn-danger:hover{border-color:var(--danger);color:var(--danger);}

.wrap{max-width:820px;margin:0 auto;padding:34px 28px 60px;}

/* HEADER */
.phead{display:flex;align-items:center;gap:24px;padding-bottom:28px;border-bottom:1px solid var(--line);}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;border:1px solid var(--gold-soft);
  background:var(--panel);display:flex;align-items:center;justify-content:center;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar span{font-family:'Playfair Display',serif;font-size:34px;color:var(--gold);}
.avatar-btn{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;
  background:var(--gold);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.avatar-btn svg{width:14px;height:14px;stroke:#0a0a0a;}
.phead-info{min-width:0;}
.eyebrow{display:block;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.pname{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;line-height:1.1;word-break:break-word;}
.pmeta{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--muted);margin-top:6px;}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);padding:26px;margin-top:26px;}
.card-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:4px;}
.card-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);margin-bottom:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field label{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.field input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--text);font-family:'Jost',sans-serif;font-size:14px;padding:8px 0;transition:border-color .3s;}
.field input:focus{outline:none;border-bottom-color:var(--gold);}
.full{grid-column:1/-1;}

/* LISTS */
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row-main{flex:1;min-width:0;}
.row-title{font-size:14px;font-weight:500;}
.row-meta{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.4px;}
.pill{font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:5px 11px;border:1px solid var(--line);
  color:var(--gold);white-space:nowrap;}
.thumb{width:52px;height:52px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);}
.empty{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--muted);padding:8px 0;}
.linkbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:6px;}
.linkbtn:hover{color:var(--danger);}
.linkbtn svg{width:15px;height:15px;stroke:currentColor;}

/* TOAST */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:13px 24px;
  font-size:12px;letter-spacing:1px;opacity:0;transition:all .35s ease;z-index:60;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{border-color:var(--danger);color:var(--danger);}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}
@media(max-width:620px){
  .wrap{padding:24px 18px 48px;}
  .grid{grid-template-columns:1fr;}
  .phead{gap:16px;}
  .avatar{width:74px;height:74px;}
  .pname{font-size:25px;}
  .topbar{padding:14px 18px;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="btn" id="backBtn">&larr; Back</button>
  <span class="topbar-label">My Profile</span>
  <button class="btn btn-danger" id="signOutBtn">Sign Out</button>
</div>

<div class="wrap" id="root">
  <p class="empty" id="bootMsg">Loading your profile&hellip;</p>
</div>

<div id="toast"></div>
<input type="file" id="avatarInput" accept="image/*" style="display:none;">

<script>
(function(){
  'use strict';
  var SUPA_URL='https://kwriicxzkgkcseorcqdi.supabase.co';
  var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3cmlpY3h6a2drY3Nlb3JjcWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MTk2NzcsImV4cCI6MjA4OTQ5NTY3N30.h886_IAOxXkaW1m9mtFX4zLJRhTN-v9N4EF_yrpAkJo';
  var supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);

  var user=null, profile={}, dirty=false;

  /* ---------- theme sync from parent modal ---------- */
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='FJ_THEME'){ document.body.classList.toggle('light-mode',!!d.light); }
    if(d.type==='FJ_PROFILE_CHECK_DIRTY'){
      if(!dirty){ post('FJ_PROFILE_CLOSE_CONFIRMED'); }
      else if(confirm('You have unsaved changes. Close anyway?')){ dirty=false; post('FJ_PROFILE_CLOSE_CONFIRMED'); }
    }
  });
  function post(type,extra){
    var msg=Object.assign({type:type},extra||{});
    try{ window.top.postMessage(msg,'*'); }catch(err){}
  }

  function toast(msg,isErr){
    var t=document.getElementById('toast');
    t.textContent=msg;
    t.className=isErr?'show err':'show';
    setTimeout(function(){ t.className=''; },2600);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function val(id){ var el=document.getElementById(id); return el?el.value.trim():''; }

  document.getElementById('backBtn').addEventListener('click',function(){
    if(dirty && !confirm('You have unsaved changes. Close anyway?')) return;
    dirty=false; post('FJ_PROFILE_CLOSE_CONFIRMED');
  });
  document.getElementById('signOutBtn').addEventListener('click',async function(){
    await supa.auth.signOut();
    post('FJ_PROFILE_SIGNED_OUT');
  });

  /* ---------- render ---------- */
  function render(){
    var first=profile.first_name||'', last=profile.last_name||'';
    var full=(first+' '+last).trim()||'Explorer';
    var initial=(first||user.email||'E').charAt(0).toUpperCase();
    var joined=user.created_at?new Date(user.created_at).toLocaleDateString('en-GB',{month:'long',year:'numeric'}):'';

    document.getElementById('root').innerHTML =
      '<div class="phead">'+
        '<div class="avatar-wrap">'+
          '<div class="avatar" id="avatarBox">'+
            (profile.avatar_url
              ? '<img src="'+esc(profile.avatar_url)+'" alt="">'
              : '<span>'+esc(initial)+'</span>')+
          '</div>'+
          '<button class="avatar-btn" id="avatarBtn" title="Change photo">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/></svg>'+
          '</button>'+
        '</div>'+
        '<div class="phead-info">'+
          '<span class="eyebrow">Welcome back</span>'+
          '<div class="pname">'+esc(full)+'</div>'+
          '<div class="pmeta">'+esc(user.email)+(joined?' &middot; Member since '+esc(joined):'')+'</div>'+
        '</div>'+
      '</div>'+

      '<div class="card">'+
        '<div class="card-title">My Details</div>'+
        '<div class="card-sub">Keep these current so we can reach you about your safari.</div>'+
        '<div class="grid">'+
          '<div class="field"><label>First Name</label><input id="pfFirst" value="'+esc(first)+'"></div>'+
          '<div class="field"><label>Last Name</label><input id="pfLast" value="'+esc(last)+'"></div>'+
          '<div class="field"><label>Phone / WhatsApp</label><input id="pfPhone" value="'+esc(profile.phone||'')+'"></div>'+
          '<div class="field"><label>Country of Residence</label><input id="pfCountry" value="'+esc(profile.country||'')+'"></div>'+
        '</div>'+
        '<div class="actions"><button class="btn btn-gold" id="saveBtn">Save Changes</button></div>'+
      '</div>'+

      '<div class="card">'+
        '<div class="card-title">My Reservations</div>'+
        '<div class="card-sub">Every journey you have booked with us.</div>'+
        '<div id="resList"><p class="empty">Loading&hellip;</p></div>'+
      '</div>'+

      '<div class="card">'+
        '<div class="card-title">My Wishlist</div>'+
        '<div class="card-sub">Packages you have saved for later.</div>'+
        '<div id="wishList"><p class="empty">Loading&hellip;</p></div>'+
      '</div>';

    ['pfFirst','pfLast','pfPhone','pfCountry'].forEach(function(id){
      document.getElementById(id).addEventListener('input',function(){ dirty=true; });
    });
    document.getElementById('saveBtn').addEventListener('click',saveDetails);
    document.getElementById('avatarBtn').addEventListener('click',function(){
      document.getElementById('avatarInput').click();
    });

    loadReservations();
    loadWishlist();
  }

  /* ---------- save ---------- */
  async function saveDetails(){
    var btn=document.getElementById('saveBtn');
    var first=val('pfFirst');
    if(!first){ toast('First name is required',true); return; }
    btn.disabled=true; btn.textContent='Saving...';
    var payload={
      id:user.id, email:user.email,
      first_name:first, last_name:val('pfLast'),
      phone:val('pfPhone'), country:val('pfCountry'),
      updated_at:new Date().toISOString()
    };
    var res=await supa.from('profiles').upsert(payload,{onConflict:'id'});
    btn.disabled=false; btn.textContent='Save Changes';
    if(res.error){ toast('Could not save: '+res.error.message,true); return; }
    profile=Object.assign(profile,payload);
    dirty=false;
    toast('Your details have been saved');
    post('FJ_PROFILE_SAVED',{firstName:payload.first_name,lastName:payload.last_name});
    var nameEl=document.querySelector('.pname');
    if(nameEl) nameEl.textContent=(payload.first_name+' '+payload.last_name).trim();
  }

  /* ---------- avatar ---------- */
  document.getElementById('avatarInput').addEventListener('change',async function(){
    var file=this.files[0]; if(!file) return;
    if(file.size>4*1024*1024){ toast('Image must be under 4MB',true); this.value=''; return; }
    toast('Uploading photo...');
    var ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    var path=user.id+'/avatar-'+Date.now()+'.'+ext;
    var up=await supa.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});
    if(up.error){ toast('Upload failed: '+up.error.message,true); this.value=''; return; }
    var pub=supa.storage.from('avatars').getPublicUrl(path);
    var url=pub.data&&pub.data.publicUrl;
    if(!url){ toast('Could not read image URL',true); return; }
    await supa.from('profiles').upsert({id:user.id,avatar_url:url,updated_at:new Date().toISOString()},{onConflict:'id'});
    profile.avatar_url=url;
    document.getElementById('avatarBox').innerHTML='<img src="'+esc(url)+'?t='+Date.now()+'" alt="">';
    toast('Photo updated');
    this.value='';
  });

  /* ---------- reservations ---------- */
  async function loadReservations(){
    var el=document.getElementById('resList');
    var r=await supa.from('reservations').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(r.error||!r.data||!r.data.length){ el.innerHTML='<p class="empty">No reservations yet.</p>'; return; }
    var labels={pending:'Pending',confirmed:'Confirmed',completed:'Completed',cancelled:'Cancelled'};
    el.innerHTML=r.data.map(function(b){
      var d=b.travel_date?new Date(b.travel_date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'Date to be confirmed';
      var people=(b.adults||1)+' adult'+((b.adults||1)!==1?'s':'')+(b.children>0?', '+b.children+' child'+(b.children!==1?'ren':''):'');
      return '<div class="row">'+
        '<div class="row-main">'+
          '<div class="row-title">'+esc(b.package_name||'Safari')+'</div>'+
          '<div class="row-meta">'+esc(d)+' &middot; '+esc(people)+(b.ref_number?' &middot; Ref '+esc(b.ref_number):'')+'</div>'+
        '</div>'+
        '<span class="pill">'+esc(labels[b.status]||'Pending')+'</span>'+
      '</div>';
    }).join('');
  }

  /* ---------- wishlist ---------- */
  async function loadWishlist(){
    var el=document.getElementById('wishList');
    var r=await supa.from('wishlists').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(r.error){ el.innerHTML='<p class="empty">Wishlist unavailable right now.</p>'; return; }
    if(!r.data||!r.data.length){ el.innerHTML='<p class="empty">Nothing saved yet \u2014 tap the heart on any package to save it here.</p>'; return; }
    el.innerHTML=r.data.map(function(w){
      return '<div class="row" data-wid="'+esc(w.id)+'">'+
        (w.image_url?'<img class="thumb" src="'+esc(w.image_url)+'" alt="">':'')+
        '<div class="row-main">'+
          '<div class="row-title">'+esc(w.package_name)+'</div>'+
          (w.package_url?'<div class="row-meta"><a href="'+esc(w.package_url)+'" target="_top" style="color:var(--gold);text-decoration:none;">View package</a></div>':'')+
        '</div>'+
        '<button class="linkbtn" data-remove="'+esc(w.id)+'" title="Remove">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>'+
        '</button>'+
      '</div>';
    }).join('');
    el.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click',async function(){
        var id=btn.getAttribute('data-remove');
        var del=await supa.from('wishlists').delete().eq('id',id);
        if(del.error){ toast('Could not remove',true); return; }
        var row=el.querySelector('[data-wid="'+id+'"]');
        if(row) row.remove();
        if(!el.querySelector('.row')) el.innerHTML='<p class="empty">Nothing saved yet \u2014 tap the heart on any package to save it here.</p>';
        toast('Removed from wishlist');
      });
    });
  }

  /* ---------- boot ---------- */
  (async function(){
    var s=await supa.auth.getSession();
    user=s.data&&s.data.session?s.data.session.user:null;
    if(!user){
      document.getElementById('root').innerHTML='<p class="empty">You are signed out. Please close this window and sign in again.</p>';
      return;
    }
    var p=await supa.from('profiles').select('*').eq('id',user.id).single();
    profile=p.data||{};
    if(!profile.id){
      var meta=user.user_metadata||{};
      var nm=(meta.full_name||meta.name||'').split(' ');
      profile={id:user.id,email:user.email,first_name:nm[0]||'',last_name:nm.slice(1).join(' ')||'',avatar_url:meta.avatar_url||''};
      await supa.from('profiles').upsert(profile,{onConflict:'id'});
    }
    render();
  })();
})();
</script>
</body>
</html>
